[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mdl-engine"
version = "0.1.0"
description = "FastMCP Semantic Layer for Privacy-Preserving SQL Translation"
dependencies = [
    "fastmcp",
    "sqlglot",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.0"
]

[project.scripts]
mdl-engine = "src.main"